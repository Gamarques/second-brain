services:
  engine:
    environment:
      SECOND_BRAIN_PUBLIC_URL: http://127.0.0.1:${SECOND_BRAIN_DEV_PORT:-8080}

  auth:
    environment:
      SECOND_BRAIN_PUBLIC_URL: http://127.0.0.1:${SECOND_BRAIN_DEV_PORT:-8080}

  admin:
    environment:
      SECOND_BRAIN_PUBLIC_URL: http://127.0.0.1:${SECOND_BRAIN_DEV_PORT:-8080}

  local-edge:
    image: nginx:1.27.4-alpine
    restart: unless-stopped
    entrypoint: ["nginx", "-g", "daemon off;"]
    ports:
      - "127.0.0.1:${SECOND_BRAIN_DEV_PORT:-8080}:8080"
    volumes:
      - ./deploy/local-nginx-main.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/local-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      engine:
        condition: service_healthy
      auth:
        condition: service_healthy
      admin:
        condition: service_healthy
    read_only: true
    user: nginx
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
