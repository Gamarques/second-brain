name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run project checks
        run: npm run check

  postgres:
    name: PostgreSQL 15 integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg15
        env:
          POSTGRES_DB: second_brain_test_admin
          POSTGRES_USER: second_brain_test
          POSTGRES_PASSWORD: second_brain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U second_brain_test -d second_brain_test_admin"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 2s
    env:
      TEST_DATABASE_ADMIN_URL: postgresql://second_brain_test:second_brain_test@127.0.0.1:5432/second_brain_test_admin
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run PostgreSQL integration tests
        run: npm run test:postgres
