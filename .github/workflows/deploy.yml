name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Commit SHA image to deploy (rollback). Empty = build HEAD and deploy it."
        required: false
        default: ""

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  check:
    # Skipped on a rollback dispatch — the requested image already exists.
    if: github.event_name == 'push' || inputs.image_tag == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: npm run check

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: image
        # GHCR requires a lowercase name; github.repository may not be.
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [check, build]
    # Run when nothing failed, including when check/build were skipped
    # because a rollback dispatch requested an existing image tag.
    if: ${{ !cancelled() && needs.check.result != 'failure' && needs.build.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate rollback commit SHA
        if: inputs.image_tag != ''
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
        run: |
          if [[ ! "$INPUT_TAG" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Rollback image_tag must be the 40-character commit SHA used to build the image." >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          # Compose and deploy.sh are an immutable part of the image contract.
          ref: ${{ inputs.image_tag || github.sha }}
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName $VPS_HOST
            User $VPS_USER
            Port $VPS_PORT
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking accept-new
          EOF
      - name: Resolve image and tag
        id: target
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=${INPUT_TAG:-$GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Copy compose file and deploy script
        run: |
          ssh vps 'mkdir -p /opt/second-brain'
          scp compose.yaml deploy/deploy.sh vps:/opt/second-brain/
      - name: Deploy
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh vps \
            "SECOND_BRAIN_IMAGE='${{ steps.target.outputs.image }}' \
             SECOND_BRAIN_IMAGE_TAG='${{ steps.target.outputs.tag }}' \
             GHCR_USER='${{ github.actor }}' \
             bash /opt/second-brain/deploy.sh"
      - name: Prune old GHCR versions
        # Keeps roughly the last 10 rollback targets so registry storage
        # stays bounded on the free plan.
        if: success() && github.event_name == 'push'
        continue-on-error: true
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: container
          min-versions-to-keep: 10
