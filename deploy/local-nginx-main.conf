worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';
  access_log /dev/stdout main;

  map $http_host $second_brain_canonical_host {
    ~^localhost(?<second_brain_public_port>:[0-9]+)?$ 127.0.0.1$second_brain_public_port;
    default $http_host;
  }

  # Docker may assign a new container address after a supervised process
  # restart. Re-resolve service names so the long-lived local edge follows it.
  resolver 127.0.0.11 valid=1s ipv6=off;
  upstream second_brain_admin {
    zone second_brain_admin 64k;
    server admin:3002 resolve;
  }
  upstream second_brain_engine {
    zone second_brain_engine 64k;
    server engine:3000 resolve;
  }
  upstream second_brain_auth {
    zone second_brain_auth 64k;
    server auth:3001 resolve;
  }

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  sendfile on;
  keepalive_timeout 65;

  include /etc/nginx/conf.d/*.conf;
}
